# =============================================================================
# LTX-2 v2.5 LoRA Training — Disney dataset demo (69 samples)
# =============================================================================
# RTX A6000 (48GB) — uses v2.5 checkpoint with Gemma4 text encoder

model:
  model_path: "/storage/Internal_NAS/Checkpoints/LTX-2_Release/v2.5/checkpoints/ltx-2.5-22b-dev-transformer-bf16.safetensors"
  text_encoder_path: "/storage/Internal_NAS/Checkpoints/LTX-2_Release/v2.5/text_encoders/gemma4-12b-with-proj-ltx-2.5-bf16.safetensors"
  video_vae_path: "/storage/Internal_NAS/Checkpoints/LTX-2_Release/v2.5/vae/ltx-2.5-video-vae-bf16.safetensors"
  training_mode: "lora"
  load_checkpoint: null

lora:
  rank: 16
  alpha: 16
  dropout: 0.0
  target_modules:
    - "to_k"
    - "to_q"
    - "to_v"
    - "to_out.0"

training_strategy:
  name: "text_to_video"
  first_frame_conditioning_p: 0.5
  with_audio: false

optimization:
  learning_rate: 1e-4
  steps: 1000
  batch_size: 1
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  optimizer_type: "adamw8bit"
  scheduler_type: "cosine"
  scheduler_params: { }
  enable_gradient_checkpointing: true

acceleration:
  mixed_precision_mode: "bf16"
  quantization: "int8-quanto"
  load_text_encoder_in_8bit: true

data:
  preprocessed_data_root: "/storage/Internal_NAS/hank/Disney-VideoGeneration-Dataset/.precomputed"
  num_dataloader_workers: 2

validation:
  prompts:
    - "A black and white animated Mickey Mouse character walks across a ship deck, with exaggerated movements and a cheerful expression."
    - "An animated sequence showing a cat chasing a mouse through a kitchen, with dynamic movements and classic cartoon style."
  negative_prompt: "worst quality, inconsistent motion, blurry, jittery, distorted"
  images: null
  video_dims: [ 512, 320, 25 ]
  frame_rate: 25.0
  seed: 42
  inference_steps: 30
  interval: 200
  video_cfg_scale: 4.0
  video_stg_scale: 1.0
  audio_stg_scale: 0.0
  stg_blocks: [ 29 ]
  generate_audio: false
  skip_initial_validation: false

checkpoints:
  interval: 500
  keep_last_n: 3
  precision: "bfloat16"

flow_matching:
  timestep_sampling_mode: "shifted_logit_normal"
  timestep_sampling_params: { }

hub:
  push_to_hub: false
  hub_model_id: null

wandb:
  enabled: false
  project: "ltx-2-trainer"
  entity: null
  tags: [ "ltx2", "lora", "disney" ]
  log_validation_videos: true

seed: 42
output_dir: "/storage/Internal_NAS/hank/ltx2_lora_disney_output"
